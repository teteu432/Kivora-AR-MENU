<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Teste de câmera Kivora</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}.ui{position:fixed;z-index:5;left:16px;right:16px;bottom:20px;background:rgba(0,0,0,.72);padding:16px;border-radius:16px}.ok{color:#72ef9d}.err{color:#ff8b8b}button{padding:12px 16px;border:0;border-radius:12px;font-weight:700}</style></head>
<body><video id="v" autoplay muted playsinline></video><div class="ui"><strong id="s">Teste simples da câmera</strong><p id="m">Toque no botão. Aqui não existe AR.js, modelo 3D ou marcador.</p><button id="b">Abrir câmera</button></div>
<script>const v=document.getElementById('v'),s=document.getElementById('s'),m=document.getElementById('m'),b=document.getElementById('b');b.onclick=async()=>{b.disabled=true;try{const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});v.srcObject=stream;await v.play();s.textContent='Câmera funcionando';s.className='ok';m.textContent=`${v.videoWidth||'?'} × ${v.videoHeight||'?'} — se você vê a mesa atrás deste texto, o navegador está OK.`;b.style.display='none'}catch(e){s.textContent='Falha na câmera';s.className='err';m.textContent=(e.name||'Erro')+': '+(e.message||'sem mensagem');b.disabled=false}};</script></body></html>
